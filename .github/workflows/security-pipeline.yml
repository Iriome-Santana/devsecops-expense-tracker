name: Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'


jobs:
  secret-scan:
    name: Secret Detection (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout expense tracker
        uses: actions/checkout@v4
        with:
          repository: Iriome-Santana/expense-tracker-sre
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    needs: secret-scan

    steps:
      - name: Checkout expense tracker
        uses: actions/checkout@v4
        with:
          repository: Iriome-Santana/expense-tracker-sre
          fetch-depth: 0

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit
        run: bandit -r src/ -f json -o bandit-report.json

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  container-scan:
    name: Container Security (Trivy)
    runs-on: ubuntu-latest
    needs: sast

    steps:
      - name: Run Trivy on Docker Hub image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'iriome2512/expense-tracker:latest'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
          format: 'table'

  dependency-scan:
    name: Dependency Scan (pip-audit)
    runs-on: ubuntu-latest
    needs: container-scan

    steps:
      - name: Checkout expense tracker
        uses: actions/checkout@v4
        with:
          repository: Iriome-Santana/expense-tracker-sre
          fetch-depth: 0

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: |
          pip-audit -r /dev/stdin << EOF
          fastapi==0.136.3
          starlette>=1.0.1
          uvicorn==0.41.0
          sqlalchemy==2.0.49
          psycopg2-binary==2.9.12
          boto3==1.43.6
          slowapi==0.1.9
          alembic==1.18.4
          pytest>=9.0.3
          setuptools>=78.1.1
          EOF

  iac-scan:
    name: IaC Security (Checkov)
    runs-on: ubuntu-latest
    needs: dependency-scan

    steps:
      - name: Checkout Terraform repo
        uses: actions/checkout@v4
        with:
          repository: Iriome-Santana/expense-tracker-terraform
          fetch-depth: 0

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          soft_fail: true
          output_format: cli
