name: Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    name: Secret Detection (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout expense tracker
        uses: actions/checkout@v4
        with:
          repository: Iriome-Santana/expense-tracker-sre
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    needs: secret-scan

    steps:
      - name: Checkout expense tracker
        uses: actions/checkout@v4
        with:
          repository: Iriome-Santana/expense-tracker-sre
          fetch-depth: 0

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit
        run: bandit -r src/ -f json -o bandit-report.json || true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  container-scan:
    name: Container Security (Trivy)
    runs-on: ubuntu-latest
    needs: sast

    steps:
      - name: Run Trivy on Docker Hub image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'iriome2512/expense-tracker:latest'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
          format: 'table'
